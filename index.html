</style></head><body><div id="toast"></div><main class="wrap"><div id="bannerSlot"><header id="globalBanner"><div class="trip-heading"><small>MY TRAVEL JOURNAL · V3.8</small><h1 id="tripTitle">我的旅遊手帳</h1><small id="tripDates"></small><div id="tripDescriptionDisplay" class="trip-description" hidden></div><form id="descriptionEditor" class="hidden" onsubmit="saveTripDescription(event)"><label for="tripDescriptionInput">旅程文字／期許／心得</label><textarea id="tripDescriptionInput" rows="4"></textarea><div class="actions"><button type="submit">儲存文字</button><button type="button" onclick="closeDescriptionEditor()">取消</button></div></form></div><div class="header-controls"><button id="themeToggle" type="button" onclick="toggleTheme()" aria-label="切換深淺主題">🌙</button><label for="tripSwitcher">目前旅程</label><select id="tripSwitcher" onchange="activateTrip(this.value)"></select><button class="description-edit" onclick="editTripDescription()">✎ 旅程文字</button></div></header></div><div class="notice" style="margin-top:15px">V3.8 交通以大眾運輸優先，但尚未串接免費大眾運輸路線資料；「待查詢」不是已完成自動規劃。此版資料僅保存在目前瀏覽器。請定期至設定頁按「匯出目前旅程 JSON」，清除網站資料或更換裝置可能遺失紀錄；旅伴即時同步尚未啟用。</div><input class="hidden" id="importFile" type="file" accept=".json,application/json" onchange="importData(event)"><div id="itinerarySticky" class="itinerary-sticky page-sticky"><div id="itineraryActions" class="page-heading"><h2>📅 每日行程</h2><button class="primary" onclick="newItem()">＋ 新增行程</button></div><div id="dayButtons" class="days"></div></div><div id="filters" class="filters"></div><div id="editor" class="panel hidden"><h2 id="editorTitle">新增行程</h2><form id="itemForm"><input type="hidden" id="itemId"><div class="field"><label for="itemKind">行程類型</label><select id="itemKind" onchange="configureItemKind()"><option value="regular">一般行程</option><option value="hotel">加入住宿地點</option></select></div><div id="hotelVisitFields" class="hidden"><p class="mini">住宿費用由住宿頁計算，不會重複計費；時間可不填。</p><div class="field"><label for="visitHotel">住宿地點</label><select id="visitHotel" onchange="chooseVisitHotel()"></select></div><div class="field"><label for="visitAction">目的</label><select id="visitAction" onchange="configureVisitAction()"><option>回飯店休息</option><option>寄放或領取行李</option><option>辦理入住</option><option>辦理退房</option><option>其他自行輸入</option></select></div><div class="field hidden" id="visitCustomWrap"><label for="visitCustom">其他目的</label><input id="visitCustom" placeholder="自行輸入目的"></div></div><div class="grid"><div class="field"><label>第幾天</label><select id="fday"></select></div><div class="field"><label>時間（HHmm／HH:mm）</label><input id="ftime" type="text" inputmode="numeric" data-time-input="true" maxlength="5" pattern="(?:(?:[01][0-9]|2[0-3])[0-5][0-9]|(?:[01][0-9]|2[0-3]):[0-5][0-9])" placeholder="HHmm，例如 2000" required><small id="hotelTimeHint" class="hidden">住宿地點可不填時間</small></div></div><div class="field"><label>景點 / 餐廳名稱</label><input id="fname" required placeholder="例如：淺草寺"></div><div class="grid"><div class="field"><label>分類</label><select id="fcategory"><option>景點</option><option>美食</option><option>購物</option><option>其他</option></select></div><div class="field"><label>停留時間（分鐘）</label><input id="fduration" type="number" min="0" value="60"></div></div><div class="field"><label>營業時間</label><input id="fhours" placeholder="例如：10:00–18:00"></div><div class="field"><label>地址 / Google Maps 地點名稱</label><input id="faddress" placeholder="例如：高雄市鹽埕區大勇路1號"></div><div class="notice">交通方式、交通時間與交通費改在「兩個景點之間」的交通卡片編輯。下方的地圖連結可留空，導航會優先使用地址。</div><div class="grid"><div class="field"><label>費用幣別</label><select id="fcurrency"></select></div><div class="field"><label>費用金額（選填）</label><input id="fcost" type="number" min="0" step="0.01" placeholder="尚未填寫"></div></div><div class="field" id="priceUnitWrap"><label>計價方式</label><select id="fpriceUnit" onchange="refreshItemPricing()"><option value="person">每人</option><option value="total">整筆</option></select></div><div id="itemSplitBox"></div><div class="field"><label>必點 / 備註</label><textarea id="fnote" rows="3"></textarea></div><div id="itemImagesEditor"></div><div class="field"><label>Google Maps 地點連結（選填）</label><input id="fmap" placeholder="可貼 Google Maps 分享連結；地址也可用於導航"></div><div class="actions"><button class="primary" type="submit">儲存行程</button><button type="button" onclick="closeEditor()">取消</button></div></form></div><div id="transportEditor" class="panel hidden"><h2 id="transportTitle">編輯兩站間交通</h2><form id="transportForm"><input type="hidden" id="transportTo"><div class="field"><label>交通方式</label><select id="tmode"><option value="步行">步行</option><option value="軌道交通">軌道交通</option><option value="公車">公車／巴士</option><option value="開車">開車／計程車</option><option value="自訂">自訂</option></select></div><div class="field"><label>當地交通工具（可自行輸入）</label><input id="tsubtype" list="localTransportTypes" placeholder="例如：JR、地鐵、台鐵、計程車"><datalist id="localTransportTypes"></datalist></div><div class="field"><label>交通路線／轉乘說明（可選填）</label><textarea id="troute" rows="2" placeholder="例如：橘線鹽埕埔站，步行至目的地"></textarea></div><div class="field"><label>備註（與路線說明分開）</label><textarea id="tnote" rows="3" placeholder="時刻表、班次、注意事項與網址"></textarea></div><div id="transportImagesEditor"></div><div class="grid"><div class="field"><label>交通時間（分鐘）</label><input id="ttravel" type="number" min="0"></div><div class="field"><label>交通費</label><input id="tcost" placeholder="例如：35 TWD"></div></div><div class="actions"><button class="primary" type="submit">儲存交通資訊</button><button type="button" onclick="closeTransportEditor()">取消</button></div></form></div><div id="listEditor" class="panel hidden"><h2 id="listEditorTitle">新增清單項目</h2><form id="listForm"><input type="hidden" id="listId"><div class="field"><label>清單類型</label><select id="ltype" required><option value="" disabled>請先選擇清單類型</option><option>行前準備</option><option>行李清單</option><option>購物清單</option><option>美食清單</option></select></div><div id="shoppingModeSelector" class="hidden"></div><div class="field"><label id="lnameLabel">項目明細</label><input id="lname" required placeholder="例如：襪子"></div><div class="field" id="ldetailWrap"><label id="ldetailLabel">想買的商品／想吃的餐點</label><input id="ldetail" placeholder="例如：韓牛"></div><div class="grid" id="llocationWrap"><div class="field"><label id="lstoreLabel">店家／購買地點</label><input id="lstore" placeholder="例如：樂天百貨 / Olive Young"></div><div class="field"><label>區域</label><input id="larea" placeholder="例如：明洞 / 弘大"></div></div><div class="field" id="laddressWrap"><label>地址／Google Maps 地點名稱</label><input id="laddress" placeholder="例如：明洞餃子本店"></div><div class="field" id="lhoursWrap"><label>營業時間（選填）</label><input id="lhours" placeholder="例如：10:00–21:00"></div><div class="field"><label id="lnoteLabel">備註</label><textarea id="lnote" rows="3"></textarea></div><div id="listImagesEditor"></div><div id="shoppingModeEditor"></div><div class="actions"><button class="primary" type="submit">儲存清單項目</button><button type="button" onclick="closeListEditor()">取消</button></div></form></div><div id="content"></div></main><nav class="bottom"><button id="tab-flights" onclick="setTab('flights')">✈️<br>航班</button><button id="tab-hotels" onclick="setTab('hotels')">🏨<br>住宿</button><button id="tab-itinerary" onclick="setTab('itinerary')">📅<br>行程</button><button id="tab-checklist" onclick="setTab('checklist')">✅<br>清單</button><button id="tab-budget" onclick="setTab('budget')">💰<br>費用</button><button id="tab-settings" onclick="setTab('settings')">⚙️<br>設定</button></nav><script>const THEME_KEY='travel_journal_theme';
const systemTheme=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
let manualTheme=null;try{const storedTheme=localStorage.getItem(THEME_KEY);if(storedTheme==='light'||storedTheme==='dark')manualTheme=storedTheme}catch{}
function applyTheme(){const dark=manualTheme?manualTheme==='dark':!!systemTheme?.matches;document.documentElement.dataset.theme=dark?'dark':'light';const button=document.getElementById('themeToggle');if(button){button.textContent=dark?'☀️':'🌙';button.setAttribute('aria-label',dark?'切換為淺色主題':'切換為深色主題');button.title=manualTheme?'已記住手動主題偏好':'跟隨系統主題'}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#171b20':'#f7f5f0'}

if(systemTheme){if(systemTheme.addEventListener)systemTheme.addEventListener('change',applyTheme);else if(systemTheme.addListener)systemTheme.addListener(applyTheme)}applyTheme();

const KEY='travel_journal_v1', OLD_WORK_KEY='travel_journal_v28', WORK_KEY='travel_journal_v29';
const demo={title:'我的高雄旅行',start:'2026-11-19',days:7,items:[{id:'a',day:1,time:'17:00',name:'駁二藝術特區',category:'景點',duration:60,hours:'10:00–18:00（示例，請查證）',route:'高雄國際機場 → 美麗島 → 鹽埕埔（紅線轉橘線）',travel:20,cost:'約 TWD 35',note:'拍照、散步',map:'駁二藝術特區',done:false},{id:'b',day:1,time:'18:30',name:'永心浮島 YONSHIN FUDOPIA',category:'美食',duration:120,hours:'12:00–23:00（示例，請查證）',route:'從駁二步行前往',travel:10,cost:'',note:'碳烤生章魚腳、台式青醬牡蠣炒麵；請確認預約',map:'永心浮島 YONSHIN FUDOPIA',done:false}],checks:[{id:'c1',text:'確認餐廳訂位',done:false},{id:'c2',text:'檢查交通票券',done:false}]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>('trip_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
function normalizeTrip(t){
 if(!t||typeof t!=='object'||!Array.isArray(t.items)||!Number.isInteger(t.days)||t.days<1||t.days>30)throw Error('旅程資料格式不符');
 t.description=typeof t.description==='string'?t.description:'';
 t.checks=Array.isArray(t.checks)?t.checks:[];t.listEntries=Array.isArray(t.listEntries)?t.listEntries:[];
 t.flights=Array.isArray(t.flights)?t.flights:[];t.hotels=Array.isArray(t.hotels)?t.hotels:[];
 t.budget=t.budget||{};t.country=t.country||'TW';t.navPreference=t.navPreference||'auto';t.dayCountries=t.dayCountries||{};
 for(const x of t.items){if(!x.address)x.address=x.map||x.name;if(!x.transport&&(x.route||x.travel||x.cost)){const r=x.route||'';x.transport={mode:/步行/.test(r)?'步行':/公車|巴士/.test(r)?'公車':/捷運|地鐵|紅線|橘線/.test(r)?'地鐵':'自訂',route:r,travel:x.travel||0,cost:x.cost||''}}}
 return t;
}
function tripCopy(t){return JSON.parse(JSON.stringify(t))}
let workspace,storageAvailable=true;
try{
 const saved=localStorage.getItem(WORK_KEY);
 if(saved){workspace=JSON.parse(saved);if(!workspace||!Array.isArray(workspace.trips)||(!workspace.trips.length&&workspace.empty!==true))throw Error('新版旅程清單格式錯誤');}
 else if(localStorage.getItem(OLD_WORK_KEY)){
  // Non-destructive V2.8 migration. Its shared pool belongs to the last active trip;
  // copying it to every trip would incorrectly mix Seoul and Tokyo collections.
  const old=JSON.parse(localStorage.getItem(OLD_WORK_KEY));
  if(!old||!Array.isArray(old.trips)||!old.trips.length)throw Error('V2.8 旅程資料格式錯誤');
  const pool=Array.isArray(old.raindropCandidates)?old.raindropCandidates:[];
  workspace={version:29,activeId:old.activeId,trips:old.trips.map(t=>({id:t.id,data:{...tripCopy(normalizeTrip(t.data)),raindropCandidates:Array.isArray(t.data.raindropCandidates)?t.data.raindropCandidates:(t.id===old.activeId?pool:[])}}))};
  localStorage.setItem(WORK_KEY,JSON.stringify(workspace));
 }
 else{
  const legacy=localStorage.getItem(KEY);let first=JSON.parse(JSON.stringify(demo));
  if(legacy){const old=JSON.parse(legacy);if(old&&Array.isArray(old.items)&&Number.isInteger(old.days)&&old.days>=1&&old.days<=30)first=old;}
  workspace={version:29,activeId:uid(),trips:[]};
  workspace.trips.push({id:workspace.activeId,data:tripCopy(normalizeTrip(first))});
  localStorage.setItem(WORK_KEY,JSON.stringify(workspace));
 }
}catch(e){console.error('旅程載入失敗，未覆寫既有資料',e);storageAvailable=false;workspace={version:28,activeId:'recovery',trips:[{id:'recovery',data:tripCopy(normalizeTrip(JSON.parse(JSON.stringify(demo))))}]};setTimeout(()=>alert('讀取旅程資料時發生問題。原有資料未被覆蓋，請先備份舊版 JSON；本次修改可能無法保存。'),300)}
applyV35WorkspaceUpgrade();
workspace.version=29;for(const t of workspace.trips){t.data.raindropCandidates=Array.isArray(t.data.raindropCandidates)?t.data.raindropCandidates:[];}
let activeTrip=workspace.trips.find(t=>t.id===workspace.activeId)||workspace.trips[0]||null;workspace.activeId=activeTrip?.id||null;
let data=activeTrip?normalizeTrip(activeTrip.data):emptyTrip();
let listType='行前準備',day=1,category='全部',tab='itinerary';
let lastGoodWorkspace=JSON.stringify(workspace);const storageRecoveryLocked=!storageAvailable;
function save(){if(storageRecoveryLocked){alert('原有資料載入異常，本次不覆寫。請保留舊資料並先處理備份。');return false}if(imagesBusy()){alert('圖片處理中，請稍候再儲存。');return false}try{syncAirportCards(data);syncHotelCards(data);if(activeTrip)activeTrip.data=tripCopy(data);workspace.empty=workspace.trips.length===0;const payload=JSON.stringify(workspace);if((imageChars(workspace)>0&&payload.length>WORKSPACE_MAX_CHARS&&payload.length>lastGoodWorkspace.length)||imageChars(workspace)>IMAGE_TOTAL_CHARS)throw Error('本機資料容量已達保守上限，請刪除部分圖片或先匯出封存。');localStorage.setItem(WORK_KEY,payload);lastGoodWorkspace=payload;storageAvailable=true;return true}catch(e){if(lastGoodWorkspace){const previousId=workspace.activeId;workspace=JSON.parse(lastGoodWorkspace);activeTrip=workspace.trips.find(t=>t.id===previousId)||workspace.trips.find(t=>t.id===workspace.activeId)||workspace.trips[0]||null;workspace.activeId=activeTrip?.id||null;data=activeTrip?normalizeTrip(activeTrip.data):emptyTrip()}storageAvailable=false;alert('未儲存這次變更，原有資料仍保留。'+(e.message||'瀏覽器空間不足')+' 可先匯出 JSON 備份。');return false}}

function activateTrip(id){const next=workspace.trips.find(t=>t.id===id);if(!next)return;if(!save()){render();return}closeEditor();closeTransportEditor();closeListEditor();closeDescriptionEditor();const modal=$('travelModal');if(modal)modal.remove();activeTrip=next;workspace.activeId=id;data=normalizeTrip(next.data);day='全部';category='全部';listType='行前準備';rdSelectedTags=[];rdSearch='';rdFilterCollection='';save();render();toast('已切換旅程')}
function newTrip(){openTripDetails(false)}

function tripManager(){return `<section class="panel"><h2>🧳 我的旅程</h2><p class="mini">每趟旅程各自保存行程、航班、住宿與費用；每趟旅程有獨立的 Raindrop 候選收藏池；切換旅程不會混用或清空其他旅程的收藏。</p><div class="actions"><button class="primary" onclick="newTrip()">＋ 新增旅程</button></div>${workspace.trips.map(t=>`<div class="list-entry"><div class="between"><div><b>${esc(t.data.title||'未命名旅程')}</b><p class="mini">${esc(t.data.start||'未定日期')} · ${Number(t.data.days)||0} 天 · Raindrop ${(t.data.raindropCandidates||[]).length} 筆 ${t.id===workspace.activeId?' · 目前編輯中':''}</p></div><div class="actions">${t.id===workspace.activeId?'<span class="tag">使用中</span>':`<button onclick="activateTrip('${t.id}')">切換</button>`}</div></div></div>`).join('')}<p class="mini">匯出後可選擇從本機移除；移除前請確認下載的 JSON 已妥善保存。匯入舊版 JSON 也不會覆蓋其他旅程。</p></section>`}
function downloadTrip(t){const blob=new Blob([JSON.stringify({format:'travel-journal-trip',version:38,trip:tripCopy(t.data)},null,2)],{type:'application/json'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download='travel-'+String(t.data.title||'trip').replace(/[\\/:*?"<>|]/g,'_').slice(0,35)+'-'+(t.data.start||'backup')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function archiveTrip(id){const t=workspace.trips.find(x=>x.id===id);if(!t)return;if(t.id===workspace.activeId&&!save())return;downloadTrip(t);if(!confirm('已啟動 JSON 下載。請先確認檔案已成功儲存且能找到。\n\n是否要「繼續進行本機移除」？按取消可保留旅程。'))return;
 if(!confirm('再次確認：你已檢查 JSON 檔案確實存在，且了解本機移除後必須靠 JSON 還原？'))return;
 if(workspace.trips.length===1)return alert('至少需要保留一趟啟用旅程。請先建立新旅程，再移除這趟。');
 const before=workspace.trips.slice();const previousId=workspace.activeId;workspace.trips=workspace.trips.filter(x=>x.id!==id);if(id===workspace.activeId){activeTrip=workspace.trips[0];workspace.activeId=activeTrip.id;data=normalizeTrip(activeTrip.data);day=1;closeEditor();closeTransportEditor();closeListEditor();closeDescriptionEditor()}

function parseCSV(text){const out=[],row=[];let field='',quoted=false;const str=String(text).replace(/^\uFEFF/,'');for(let i=0;i<str.length;i++){const c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))out.push([...row]);row.length=0;field=''}else field+=c}if(quoted)throw Error('CSV 引號格式不完整');row.push(field);if(row.some(v=>v.trim()))out.push(row);return out}

async function importRaindropCSV(ev){const file=ev.target.files?.[0];if(!file)return;try{if(file.size>8*1024*1024)throw Error('檔案過大（上限 8MB），請分批匯入');const csv=parseCSV(await file.text());if(csv.length<2)throw Error('找不到 CSV 資料列');const heads=csv[0].map(h=>h.trim().toLowerCase());if(!heads.some(h=>['link','url'].includes(h))||!heads.some(h=>['title','name'].includes(h)))throw Error('CSV 需要 title/name 與 link/url 欄位，請使用 Raindrop 匯出的 CSV');if(rdImportMode==='replace'){if(!confirm('將以這份 CSV 取代目前全部候選收藏，已加入行程的資料不受影響。確定嗎？'))return;data.raindropCandidates=[];rdSelectedTags=[];}if(!Array.isArray(data.raindropCandidates))data.raindropCandidates=[];const seen=new Set(data.raindropCandidates.map(raindropKey));let added=0,skipped=0;for(const cells of csv.slice(1)){const o={};heads.forEach((h,i)=>o[h]=cells[i]||'');const url=csvField(o,'link','url'),title=csvField(o,'title','name');if(!url||!title||!/^https?:\/\//i.test(url)){skipped++;continue}const sourceId=csvField(o,'id','_id','raindrop id');const tags=csvField(o,'tags','tag').split(/[,;|]/).map(v=>v.trim()).filter(Boolean);const candidate={id:'rd'+Date.now()+'_'+added,sourceId,url,title,collection:csvField(o,'collection','collection title','folder'),tags,description:csvField(o,'excerpt','description','note','notes'),category:'待分類',addedAt:new Date().toISOString()};const key=raindropKey(candidate);if(seen.has(key)){skipped++;continue}seen.add(key);data.raindropCandidates.push(candidate);added++}save();render();toast(`新增 ${added} 筆，略過 ${skipped} 筆`)}catch(e){alert('Raindrop 匯入失敗：'+e.message)}finally{ev.target.value=''}}
function rdFiltersChanged(){rdFilterCollection=$('rdCollection')?.value||'';rdSearch=$('rdSearch')?.value||'';render()}
function renderRaindrop(){const arr=data.raindropCandidates||[];const collections=[...new Set(arr.map(x=>x.collection).filter(Boolean))].sort();const tagCounts=new Map();for(const x of arr){for(const t of rdHashtags(x))tagCounts.set(t,(tagCounts.get(t)||0)+1)}const tags=[...tagCounts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));const matches=arr.filter(x=>(!rdFilterCollection||x.collection===rdFilterCollection)&&(!rdSelectedTags.length||(rdTagMode==='and'?rdSelectedTags.every(t=>rdHashtags(x).includes(t)):rdSelectedTags.some(t=>rdHashtags(x).includes(t))))&&(!rdSearch||[x.title,x.url,x.description,x.collection,...rdHashtags(x)].join(' ').toLowerCase().includes(rdSearch.toLowerCase())));const noTags=arr.filter(x=>!rdHashtags(x).length).length;return `<section class="panel"><div id="checklistSticky" class="checklist-sticky page-sticky"><div class="page-heading"><h2>✅ 旅行清單</h2><button class="primary" onclick="newListEntry()">＋ 新增項目</button></div><div class="list-tabs">${['行前準備','行李清單','購物清單','美食清單','Raindrop 收藏'].map(t=>`<button class="${listType===t?'active':''}" onclick="chooseListType('${t}')">${t}</button>`).join('')}</div><details class="rd-sticky-filters" ${rdStickyFiltersOpen?'open':''} ontoggle="rdStickyFiltersOpen=this.open;queueStickyBarMetrics()"><summary>收藏篩選${rdSelectedTags.length?' · 已選 '+rdSelectedTags.length+' 個標籤':''}${rdFilterCollection?' · '+esc(rdFilterCollection):''}${rdSearch?' · 搜尋中':''}</summary><div class="field"><label>收藏資料夾</label><select id="rdCollection" onchange="rdFiltersChanged()"><option value="">全部資料夾</option>${collections.map(c=>`<option value="${esc(c)}" ${rdFilterCollection===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Hashtag 分類（可複選）</label><div class="actions"><button class="${rdTagMode==='or'?'primary':''}" onclick="rdSetTagMode('or')">符合任一 OR</button><button class="${rdTagMode==='and'?'primary':''}" onclick="rdSetTagMode('and')">符合全部 AND</button></div><div class="rd-tag-strip"><button class="${rdSelectedTags.length?'':'primary'}" onclick="rdResetTags()">全部 (${arr.length})</button>${tags.map(([t,n])=>`<button class="${rdSelectedTags.includes(t)?'primary':''}" onclick="rdToggleTag(decodeURIComponent('${encodeURIComponent(t)}'))">${esc(t)} (${n})</button>`).join('')}</div><p class="mini">無 hashtag：${noTags} 筆${rdSelectedTags.length?' · 已選：'+esc(rdSelectedTags.join('、')):''}</p></div><div class="field"><label>搜尋收藏</label><input id="rdSearch" value="${esc(rdSearch)}" placeholder="搜尋貼文內容、hashtag、網址" oninput="rdSearch=this.value;const pos=this.selectionStart;render();const input=$('rdSearch');input.focus();input.setSelectionRange(pos,pos)"></div></details></div><h2>☁️ Raindrop 收藏候選池（僅目前旅程）</h2><p class="mini">這份收藏只屬於目前旅程，切換旅程後會顯示該旅程自己的收藏。可從 Raindrop CSV 的標籤與 IG 內文 hashtag 自動分類。可切換符合任一（OR）或全部（AND）標籤；來源影片不會自動辨識內容。加入行程前仍須確認實際店名及地址。</p><div class="actions"><button class="primary" onclick="rdImportMode='append';$('raindropFile').click()">追加匯入 CSV</button><button onclick="rdImportMode='replace';$('raindropFile').click()">清空後匯入 CSV</button><button onclick="clearRaindropPool()">清空候選池</button><input class="hidden" id="raindropFile" type="file" accept="*/*" onchange="importRaindropCSV(event)"></div><p class="mini">支援 .csv 及沒有副檔名的 CSV 文字檔；會依內容檢查必要欄位，重複收藏不會新增。</p><p class="mini">候選 ${matches.length}／${arr.length} 筆；加入行程時不自動填入長篇貼文或來源帳號。</p>${matches.map(x=>{const ts=rdHashtags(x);const preview=rdCleanPreview(x);return `<div class="list-entry"><b>${esc(x.title.length>90?x.title.slice(0,90)+'…':x.title)}</b><p class="mini">📁 ${esc(x.collection||'未分類')} · ${/instagram\.com/i.test(x.url)?'Instagram': '網頁收藏'}</p>${ts.length?`<div class="actions" style="gap:4px">${ts.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:'<p class="mini">無 hashtag</p>'}${preview?`<p class="mini">${esc(preview)}${String(x.description||'').length>120?'…':''}</p>`:''}${x.description?`<details><summary>查看完整原始介紹</summary><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.description)}</p></details>`:''}<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看原始收藏 ↗</a></p><div class="actions"><button class="primary" onclick="scheduleRaindrop('${esc(x.id)}')">加入行程</button><button onclick="deleteRaindrop('${esc(x.id)}')">移除候選</button></div></div>`}).join('')||'<div class="empty">目前沒有符合條件的收藏，請調整標籤或搜尋條件。</div>'}</section>`}

function scheduleRaindrop(id){const x=(data.raindropCandidates||[]).find(x=>x.id===id);if(!x)return;const name=prompt('請輸入真正的景點／店家名稱（不要使用 IG 帳號或貼文標題）','');if(name===null)return;if(!name.trim())return alert('請先確認實際地點名稱；原始貼文標題不會自動當作景點。');const d=prompt('加入第幾天？（1–'+data.days+'）','1');if(d===null)return;const dayNum=Number(d);if(!Number.isInteger(dayNum)||dayNum<1||dayNum>data.days)return alert('請輸入有效天數');const tRaw=prompt('預計時間（HHmm，例如 1200）','');if(tRaw===null)return;const t=time24(tRaw);if(!t)return alert('請輸入有效四位時間 HHmm 或 HH:mm');const type=prompt('分類：輸入 1 景點、2 美食、3 購物、4 其他','1');if(type===null)return;const categories={'1':'景點','2':'美食','3':'購物','4':'其他'};if(!categories[type])return alert('請輸入 1–4');data.items.push({id:'i'+Date.now(),day:dayNum,time:t,name:name.trim(),category:categories[type],duration:60,hours:'',address:'',note:'',map:'',sourceUrl:x.url,sourceTitle:x.title,transport:{},done:false,costAmount:null,currency:tripCurrency(),priceUnit:'person',sourceRaindropId:x.sourceId||x.id});save();day=dayNum;tab='itinerary';category='全部';render();toast('已加入行程，原文保留在來源連結；請補充地址及備註')}
function deleteRaindrop(id){if(!confirm('移除這筆候選收藏？已安排的行程不會刪除，Raindrop 原始收藏也不受影響。'))return;data.raindropCandidates=(data.raindropCandidates||[]).filter(x=>x.id!==id);save();render()}
function chooseListType(t){listType=t;closeListEditor();render()}
function closeListEditor(){$('listEditor').classList.add('hidden')}
function newListEntry(){closeEditor();closeTransportEditor();$('content').before($('listEditor'));$('listForm').reset();$('listId').value='';$('ltype').value='';configureListForm();initImageEditor('list',[],'listImagesEditor');initShoppingEditor(null);$('listEditorTitle').textContent='新增清單項目';$('listEditor').classList.remove('hidden');$('listEditor').scrollIntoView({behavior:'smooth'})}
function editListEntry(id){const x=listEntriesFor(listType).find(x=>String(x.id)===String(id));if(!x)return;closeEditor();closeTransportEditor();$('content').before($('listEditor'));mountInline($('listEditor'),'list-'+id);$('listId').value=x.id;$('ltype').value=x.type;configureListForm();$('lname').value=x.name||'';$('ldetail').value=x.detail||'';$('lstore').value=x.store||'';$('larea').value=x.area||'';$('laddress').value=x.address||'';$('lhours').value=x.hours||'';$('lnote').value=x.note||'';initImageEditor('list',x.images||[],'listImagesEditor');initShoppingEditor(x);$('listEditorTitle').textContent='編輯清單：'+x.name;$('listEditor').classList.remove('hidden');revealInline($('listEditor'))}
$('listForm').addEventListener('submit',e=>{e.preventDefault();if(!normalizeFormTimes(e.currentTarget||e.target))return;if(imagesBusy())return alert('圖片處理中，請稍候再儲存');const id=$('listId').value;const old=data.listEntries.find(x=>String(x.id)===String(id));const legacy=data.checks.find(x=>String(x.id)===String(id));const x={id:id||'l'+Date.now(),type:$('ltype').value,name:$('lname').value.trim(),detail:$('ldetail').value.trim(),store:$('lstore').value.trim(),area:$('larea').value.trim(),address:$('laddress').value.trim(),hours:$('lhours').value.trim(),note:$('lnote').value.trim(),images:readImages('list'),done:old?.done||legacy?.done||false};if(x.type==='購物清單'){applyShoppingDraft(x,old);if(x.shoppingMode==='store'&&x.products.some(p=>!p.name?.trim()))return alert('請填寫每個商品的名稱／品項')}if(!x.name)return;if(legacy){data.checks=data.checks.filter(c=>String(c.id)!==String(id));data.listEntries.push(x)}else if(old)Object.assign(old,x);else data.listEntries.push(x);listType=x.type;if(!save())return;closeListEditor();render();toast('清單項目已儲存')});
function toggleListEntry(id,v){const x=data.listEntries.find(x=>String(x.id)===String(id))||data.checks.find(x=>String(x.id)===String(id));if(x){x.done=v;save();render()}}
function deleteListEntry(id){if(!confirm('確定刪除這筆清單項目？已安排的每日行程不受影響。'))return;data.listEntries=data.listEntries.filter(x=>String(x.id)!==String(id));data.checks=data.checks.filter(x=>String(x.id)!==String(id));save();render()}
function startSchedule(id){const x=data.listEntries.find(x=>String(x.id)===String(id));if(!x)return;const answer=prompt('將「'+x.name+'」安排在第幾天？（1–'+data.days+'）',day==='全部'?'1':String(day));if(answer===null)return;const n=Number(answer);if(!Number.isInteger(n)||n<1||n>data.days){alert('請輸入有效的旅遊天數');return;}const timeRaw=prompt('預計抵達時間（HHmm，例如 1200）','');if(timeRaw===null)return;const time=time24(timeRaw);if(!time){alert('請輸入四位時間 HHmm，例如 1200，或 HH:mm');return;}const item={id:'i'+Date.now(),day:n,time,name:x.type==='購物清單'?(x.store||x.name):x.name,category:x.type==='美食清單'?'美食':'購物',duration:60,hours:x.hours||'',address:x.address||'',note:[x.detail?(x.type==='美食清單'?'必點：':'想買：')+x.detail:'',x.store?'店家／分店：'+x.store:'',x.area?'區域：'+x.area:'',x.note||'',x.shoppingMode==='store'?'商品：'+(x.products||[]).map(p=>p.name).join('、'):''].filter(Boolean).join('\n'),map:'',transport:{},done:false,sourceListId:x.id};data.items.push(item);save();day=n;category='全部';tab='itinerary';closeListEditor();render();toast('已加入 Day '+n+'，可點編輯補充資訊')}

async function addImageFiles(scope,files){const draft=imageDrafts.get(scope);if(!draft||draft.busy)return;draft.busy=true;refreshImageDraft(scope);try{for(const file of Array.from(files||[])){if(draft.images.length>=IMAGE_MAX_COUNT)throw Error('每筆最多 8 張圖片');const image=await compressImage(file);const pending=Array.from(imageDrafts.values()).reduce((n,d)=>n+Math.max(0,imageChars(d.images)-(d.initialChars||0)),0);if(imageChars(workspace)+pending+image.dataUrl.length>IMAGE_TOTAL_CHARS)throw Error('圖片總量接近本機上限；請刪除部分圖片或先匯出封存');draft.images.push(image)}}catch(e){alert(e.message)}finally{draft.busy=false;refreshImageDraft(scope)}}
function pasteImageFiles(event,scope){const files=Array.from(event.clipboardData?.items||[]).filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(files.length){event.preventDefault();addImageFiles(scope,files)}}

function bookingWarnings(t){const reasons=[],start=dateISO(t.start),end=endDate(t),flights=t.flights||[],hotels=t.hotels||[];for(const f of flights){const label='航班 '+(f.number||f.airline||'未命名'),dep=dateISO(f.date),arr=dateISO(f.arrivalDate||f.date);if(!dep)reasons.push(label+'尚未填出發日期');if(dep&&validDate(dep)&&start&&end){if(dep<start||dep>end)reasons.push(label+'出發日期不在旅程日期內');if(f.direction==='去程'&&isJourneyBoundary(f,flights,'outbound')&&dep!==start)reasons.push(label+'去程出發日期與旅程首日不同');if(f.direction==='回程'&&isJourneyBoundary(f,flights,'return')&&dep!==end)reasons.push(label+'回程出發日期與旅程末日不同')}if(f.arrivalDate&&validDate(arr)&&validDate(dep)&&arr<dep)reasons.push(label+'抵達日期早於出發日期，請確認跨時區或日期輸入');if(!f.arrivalDate&&time24(f.arrive)&&time24(f.depart)&&time24(f.arrive)<time24(f.depart))reasons.push(label+'抵達時間早於起飛時間，可能跨日／跨時區，請確認抵達日期');if(f.arrivalDate&&arr===dep&&time24(f.arrive)&&time24(f.depart)&&time24(f.arrive)<time24(f.depart))reasons.push(label+'同日抵達時間早於起飛時間，請確認跨時區情形');if(f.arrivalDate&&validDate(arr)&&start&&end&&(arr<start||arr>end))reasons.push(label+'抵達日期不在旅程日期內')}
const inbound=desiredFlightCards(t).filter(s=>s.role==='endpoint'&&s.arrival).map(s=>s.f).filter(f=>validDate(f.arrivalDate||f.date)).sort((a,b)=>dateISO(a.arrivalDate||a.date).localeCompare(dateISO(b.arrivalDate||b.date)))[0];for(const h of hotels){const label='住宿「'+(h.name||'未命名')+'」',ci=dateISO(h.checkin),co=dateISO(h.checkout);if(!ci||!co)reasons.push(label+'尚未填入住／退房日期');if(validDate(ci)&&validDate(co)&&co<ci)reasons.push(label+'退房早於入住');if(start&&end&&((validDate(ci)&&(ci<start||ci>end))||(validDate(co)&&(co<start||co>end))))reasons.push(label+'入住／退房日期超出旅程日期');if(inbound&&validDate(ci)){const arrival=dateISO(inbound.arrivalDate||inbound.date);if(ci<arrival)reasons.push(label+'入住日期早於去程抵達日期（可能是預訂前一晚，請確認）');else if(ci===arrival&&time24(h.checkinTime)&&time24(inbound.arrive)&&time24(h.checkinTime)<time24(inbound.arrive))reasons.push(label+'入住時間早於去程抵達時間，請確認實際入住安排')}}for(const f of flights)if(f.stopType==='visit'){if(!validStopDay(f,t))reasons.push('航班 '+(f.number||f.airline||'未命名')+' 的出境停留 Day 未指定或超出天數，請至航班編輯；原卡片規劃保留但不顯示於每日行程');else if(validDate(f.arrivalDate||f.date)&&dayDateISO(t,Number(f.stopDay))!==dateISO(f.arrivalDate||f.date))reasons.push('航班 '+(f.number||f.airline||'未命名')+' 的出境停留 Day 與抵達日期不同，請確認跨日／過夜安排')}return [...new Set(reasons)]}
function reviewDateWarnings(reasons){if(!reasons.length)return Promise.resolve(true);return new Promise(resolve=>{$('dateWarningDialog')?.remove();const cover=document.createElement('div');cover.id='dateWarningDialog';cover.className='modal-cover';cover.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-label="日期提醒"><h2>請確認日期與時間</h2><ul>${reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>僅提醒，不會自動修改航班、住宿或旅程日期。</p><div class="actions"><button type="button" id="dateWarningBack">返回修改</button><button type="button" class="primary" id="dateWarningSave">仍然儲存</button></div></div>`;document.body.appendChild(cover);$('dateWarningBack').onclick=()=>{cover.remove();resolve(false)};$('dateWarningSave').onclick=()=>{cover.remove();resolve(true)}})}

function hasReference(value){return value!==undefined&&value!==null&&String(value)!==''}
function generatedFlightId(item){if(hasReference(item?._flightId))return String(item._flightId);const id=String(item?.id||'');if(id.startsWith('airport_')&&(['arrival','departure'].includes(item?._airportKind)||(item?.airportPlan&&item?.flightNumber!==undefined&&item?.airport!==undefined)))return id.slice(8);return null}
function cleanAirportReferences(t,ids){const removed=new Set((ids||[]).map(String));if(!removed.size)return;for(const x of t.items||[])if(hasReference(x.transport?.fromId)&&removed.has(String(x.transport.fromId)))x.transport={};for(const [day,order] of Object.entries(t.itineraryOrder||{}))if(Array.isArray(order))t.itineraryOrder[day]=order.filter(id=>!removed.has(String(id)))}
function migrateTripV35(trip){let removed=0,changed=0;if(!trip||!Array.isArray(trip.items))return {removed,changed};trip.items=trip.items.filter(x=>{if(x.category==='住宿'&&!hasReference(x.hotelId)&&generatedFlightId(x)===null){removed++;changed++;return false}if(hasReference(x.hotelId)){if(x.hotelId!==String(x.hotelId)){x.hotelId=String(x.hotelId);changed++}if(x.category==='住宿'){x.category='住宿地點';changed++}}const flightId=generatedFlightId(x);if(flightId!==null&&x._flightId!==flightId){x._flightId=flightId;changed++}return true});if(removed){const ids=new Set(trip.items.map(x=>String(x.id)));for(const [day,order] of Object.entries(trip.itineraryOrder||{}))if(Array.isArray(order))trip.itineraryOrder[day]=order.filter(id=>ids.has(String(id)))}return {removed,changed}}
function applyV35WorkspaceUpgrade(){if(!storageAvailable)return;try{const candidate=tripCopy(workspace);let changes=0;for(const t of candidate.trips||[])changes+=migrateTripV35(t.data).changed;if(changes){candidate.v35CleanupVersion=35;localStorage.setItem(WORK_KEY,JSON.stringify(candidate));workspace=candidate}}catch(e){storageAvailable=false;console.error('V3.5 舊分類清理未保存，保留原資料',e);setTimeout(()=>alert('儲存空間不足或資料異常，本次未清除舊住宿分類資料。請先匯出 JSON 備份。'),300)}}

function renderFlightEditor(){const current=$('flightDialog');if(current)current.remove();clearFlightImageDrafts();flightDraft.legs.forEach((x,i)=>initImageEditor(flightImageScope(i),x.images||[],null));const cover=document.createElement('div');cover.id='flightDialog';cover.className=flightDraft.editing?'inline-travel-editor':'modal-cover';cover.innerHTML=`<div class="modal-box flight-dialog-box" role="dialog" aria-label="航班新增與編輯"><h2>${flightDraft.editing?'編輯航班':'新增航班'}</h2><form id="flightGroupForm"><div class="field"><label for="flightMode">航班類型</label><select id="flightMode" ${flightDraft.editing?'disabled':''} onchange="changeFlightMode(this.value)">${['oneway','roundtrip','multi'].map(mode=>`<option value="${mode}" ${flightDraft.mode===mode?'selected':''}>${flightModeLabel(mode)}</option>`).join('')}</select></div><p class="mini">${flightDraft.mode==='roundtrip'?'去程、回程同畫面一次儲存；各航段仍可獨立編輯。':flightDraft.mode==='multi'?'依實際飛行順序排列。每段選用途；中途單純轉機不另建卡片，去程最後抵達與回程最先出發連動首／末日。':'可選去程、回程或其他用途。'}編輯不會自動改動原訂日期。</p>${flightDraft.legs.map((x,i)=>renderFlightLeg(i)).join('')}${flightDraft.mode==='multi'?'<button type="button" onclick="addFlightDraftLeg()">＋ 新增航段</button>':''}<div class="actions"><button class="primary" type="submit">${flightDraft.singleEdit?'儲存此航段':'一次儲存航班組'}</button><button type="button" onclick="cancelFlightEditor()">取消</button></div></form></div>`;if(flightDraft.editing){const anchor=$('flight-'+flightDraft.legs[0].id);(anchor||$('content')).appendChild(cover);revealInline(cover)}else document.body.appendChild(cover);flightDraft.legs.forEach((x,i)=>setCurrencyOptions($('fl_'+i+'_costCurrency'),x.costCurrency||readCost(x.cost,tripCurrency())?.currency||'TWD'));$('flightGroupForm').addEventListener('submit',saveFlightDraft)}
function changeFlightMode(mode){if(!flightDraft||flightDraft.editing||!['oneway','roundtrip','multi'].includes(mode))return;if(imagesBusy()){ $('flightMode').value=flightDraft.mode;return alert('圖片處理中，請稍候') }refreshFlightDraftImages();const count=mode==='oneway'?1:2;if(flightDraft.legs.length>count&&!confirm('切換類型會捨棄多出的未儲存航段及圖片，確定？')){$('flightMode').value=flightDraft.mode;return}flightDraft.legs=flightDraft.legs.slice(0,count);flightDraft.manual=flightDraft.manual.slice(0,count);while(flightDraft.legs.length<count){flightDraft.legs.push(newFlightLeg(mode==='roundtrip'?'return':'outbound'));flightDraft.manual.push({})}flightDraft.mode=mode;if(mode==='roundtrip'){flightDraft.legs[0].journeyRole='outbound';flightDraft.legs[0].direction='去程';flightDraft.legs[1].journeyRole='return';flightDraft.legs[1].direction='回程';prefillReturnAirports()}renderFlightEditor()}
function prefillReturnAirports(){if(flightDraft?.mode!=='roundtrip')return;const [out,back]=flightDraft.legs,manual=flightDraft.manual[1]||{};for(const [key,from] of [['origin','destination'],['destination','origin']])if(!manual[key]){back[key]=out[from]||'';const el=$('fl_1_'+key);if(el)el.value=back[key]}}
function flightFieldChanged(i,key,value){if(!flightDraft?.legs[i])return;const x=flightDraft.legs[i],manual=flightDraft.manual[i]||(flightDraft.manual[i]={});flightDraft.dirty=true;x[key]=value;if(key==='costAmount')x.cost='';if(key==='arrivalDate'||key==='origin'||key==='destination')manual[key]=true;if(key==='date'&&!manual.arrivalDate){x.arrivalDate=value;const el=$('fl_'+i+'_arrivalDate');if(el)el.value=value}if(key==='journeyRole')x.direction=value==='return'?'回程':value==='outbound'?'去程':'轉機／其他';if(key==='stopType')$('stopDayWrap_'+i).hidden=value!=='visit';if(key==='origin'||key==='destination'){const terminal=key==='origin'?'originTerminal':'destinationTerminal',box=$('fl_'+i+'_'+terminal+'_terminals');if(box)box.innerHTML=(TERMINALS[airportCode(value)]||[]).map(v=>`<option value="${esc(v)}"></option>`).join('');if(i===0)prefillReturnAirports()}}
function addFlightDraftLeg(){if(imagesBusy())return alert('圖片處理中，請稍候');refreshFlightDraftImages();flightDraft.legs.push(newFlightLeg(flightRole(flightDraft.legs.at(-1))));flightDraft.manual.push({});renderFlightEditor()}
function removeFlightDraftLeg(i){if(imagesBusy())return alert('圖片處理中，請稍候');if(flightDraft.legs.length<=1)return alert('至少保留一個航段；整組刪除請使用航班頁按鈕。');if(!confirm('從本次編輯移除此航段及圖片？儲存時才會刪除原航段與對應卡片。'))return;refreshFlightDraftImages();flightDraft.legs.splice(i,1);flightDraft.manual.splice(i,1);renderFlightEditor()}
function moveFlightDraftLeg(i,delta){const j=i+delta;if(j<0||j>=flightDraft.legs.length||imagesBusy())return;refreshFlightDraftImages();[flightDraft.legs[i],flightDraft.legs[j]]=[flightDraft.legs[j],flightDraft.legs[i]];[flightDraft.manual[i],flightDraft.manual[j]]=[flightDraft.manual[j],flightDraft.manual[i]];renderFlightEditor()}
function flightDraftRecords(draft){return draft.legs.map((leg,i)=>{const f=tripCopy(leg);for(const [key,,kind] of flightFields){if(key==='cost'||key==='direction')continue;if(kind==='date')f[key]=dateISO(f[key]);else if(kind==='time')f[key]=f[key]?time24(f[key]):'';else f[key]=String(f[key]??'').trim()}f.journeyRole=flightRole(f);f.direction=f.journeyRole==='return'?'回程':f.journeyRole==='outbound'?'去程':'轉機／其他';f.costAmount=f.costAmount===null||f.costAmount===''||f.costAmount===undefined?(readCost(f.cost,f.costCurrency||tripCurrency())?.value??null):Number(f.costAmount);f.costCurrency=f.costCurrency||tripCurrency();f.cost=f.costAmount===null?'':f.costCurrency+' '+f.costAmount;f.splitMode='self';f.splitCount=1;f.myShare=null;f.stopDay=f.stopDay===''||f.stopDay==null?null:Number(f.stopDay);if(!draft.singleEdit){f.groupId=draft.groupId;f.groupType=draft.mode;f.groupOrder=i}return f})}
function validateFlightDraft(draft,trip){for(const [i,f] of draft.legs.entries()){if(!String(f.number||'').trim()&&!String(f.airline||'').trim())return '航段 '+(i+1)+'：請填寫航空公司或航班號碼';for(const key of ['date','arrivalDate'])if(f[key]&&!validDate(f[key]))return '航段 '+(i+1)+'：請選有效日期';for(const key of ['depart','arrive','boarding'])if(f[key]&&!time24(f[key]))return '航段 '+(i+1)+'：時間須為 HHmm 或 HH:mm';if(f.stopType==='visit'&&(!Number.isInteger(Number(f.stopDay))||Number(f.stopDay)<1||Number(f.stopDay)>trip.days))return '航段 '+(i+1)+'：請重新指定有效的出境停留 Day（1～'+trip.days+'）';if(f.costAmount!==''&&f.costAmount!=null&&(!Number.isFinite(Number(f.costAmount))||Number(f.costAmount)<0))return '航段 '+(i+1)+'：費用須為非負數'}return ''}
function applyFlightRecords(trip,originalIds,records){const ids=new Set(originalIds.map(String));const replacement=new Map(records.map(f=>[String(f.id),f]));trip.flights=(trip.flights||[]).filter(f=>!ids.has(String(f.id))||replacement.has(String(f.id))).map(f=>replacement.get(String(f.id))||f);const existing=new Set(trip.flights.map(f=>String(f.id)));for(const f of records)if(!existing.has(String(f.id)))trip.flights.push(f);syncAirportCards(trip);}
async function saveFlightDraft(e){e.preventDefault();if(!flightDraft||flightDraft.tripId!==workspace.activeId)return alert('旅程已切換，請重新開啟航班編輯。');if(imagesBusy())return alert('圖片處理中，請稍候');if(!normalizeFormTimes(e.currentTarget||e.target))return;refreshFlightDraftImages();const error=validateFlightDraft(flightDraft,data);if(error)return alert(error);const records=flightDraftRecords(flightDraft),next=tripCopy(data);applyFlightRecords(next,flightDraft.originalIds,records);const kept=new Set(next.items.map(x=>String(x.id))),removed=data.items.filter(x=>generatedFlightId(x)!==null&&!kept.has(String(x.id)));if(removed.length&&!confirm('本次修改會移除 '+removed.length+' 張不再連動的機場卡片及其交通、備註、圖片：\n'+removed.map(x=>x.name).join('\n')+'\n其他行程保留。確定儲存？'))return;const issues=bookingWarnings(next);if(!await reviewDateWarnings(issues))return;if(!flightDraft||flightDraft.tripId!==workspace.activeId)return;data=next;if(!save())return;cancelFlightEditor();render();toast('航班已一次儲存')}
function deleteFlightGroup(groupId){const flights=data.flights.filter(f=>String(f.groupId)===String(groupId));if(!flights.length)return;const ids=new Set(flights.map(f=>String(f.id))),linked=data.items.filter(x=>ids.has(generatedFlightId(x)));if(!confirm('確定刪除這組 '+flights.length+' 個航段？\n'+flights.map(f=>(f.number||f.airline||'未命名')+' '+airportDisplay(f.origin)+' → '+airportDisplay(f.destination)).join('\n')+'\n一併移除 '+linked.length+' 張自動機場卡片及其交通、備註、圖片；其他航班與一般行程保留。'))return;if(!save())return;data.flights=data.flights.filter(f=>!ids.has(String(f.id)));const removed=linked.map(x=>x.id);data.items=data.items.filter(x=>!ids.has(generatedFlightId(x)));cleanAirportReferences(data,removed);if(save())render()}
function flightCardHTML(x){return `<article id="flight-${esc(x.id)}" class="travel-card"><h3>${esc(x.direction||'航班')} · ${esc(x.airline||'航空公司')} ${esc(x.number||'')}</h3><p><b>${esc(airportDisplay(x.origin)||'出發機場')}${x.originTerminal?' · '+esc(x.originTerminal):''} → ${esc(airportDisplay(x.destination)||'抵達機場')}${x.destinationTerminal?' · '+esc(x.destinationTerminal):''}</b></p><p>📅 出發 ${esc(displayDate(x.date))} ${esc(time24(x.depart)||'—')}<br>抵達 ${esc(displayDate(x.arrivalDate||x.date))} ${esc(time24(x.arrive)||'—')}</p><p>登機 ${esc(time24(x.boarding)||'尚未填寫')} · 登機門 ${esc(x.gate||'待確認')}</p><p>🧳 托運 ${esc(x.checkedBag||'—')} kg · 手提 ${esc(x.cabinBag||'—')} kg</p>${x.groupType==='multi'?`<p>${x.stopType==='visit'?'出境停留 · '+(validStopDay(x,data)?'Day '+x.stopDay:'⚠ 請編輯重新指定 Day'):'單純轉機／最終抵達（依航段用途連動）'}</p>`:''}<p>💰 ${esc(x.costAmount!=null?(x.costCurrency||tripCurrency())+' '+Number(x.costAmount).toLocaleString():x.cost||'尚未填寫')}</p>${x.note?`<p>📝 ${noteHTML(x.note)}</p>`:''}${imageGallery(x.images)}<div class="actions"><button data-flight-edit="${esc(x.id)}">✏️ 編輯此航段</button><button data-flight-status="${esc(x.id)}">🔎 查詢航班動態</button><button data-flight-delete="${esc(x.id)}">刪除此航段</button></div></article>`}
function renderFlights(){const flights=data.flights||[],seen=new Set();let body='';for(const f of flights){if(f.groupId){if(seen.has(String(f.groupId)))continue;seen.add(String(f.groupId));const group=flights.filter(x=>String(x.groupId)===String(f.groupId)).sort((a,b)=>(a.groupOrder||0)-(b.groupOrder||0));body+=`<section class="flight-group"><h3>${esc(flightModeLabel(f.groupType))} · ${group.length} 個航段</h3><div class="actions"><button data-flight-group-edit="${esc(f.groupId)}">編輯整組</button><button data-flight-group-delete="${esc(f.groupId)}">刪除整組</button></div>${group.map(flightCardHTML).join('')}</section>`}else body+=flightCardHTML(f)}return `<section class="panel"><div id="flightSticky" class="page-sticky travel-sticky"><div class="page-heading"><h2>✈️ 航班資訊</h2><button class="primary" onclick="openFlightEditor()">＋ 新增航班</button></div></div><p class="mini">單程、來回或多航段可一次建立；航班時間與登機資訊請以航空公司最新公告為準。費用僅計每段本人金額。</p>${body||'<p class="mini">尚未新增航班。</p>'}</section>`}
function initFlightEvents(){document.addEventListener('click',e=>{for(const [attribute,action] of [['data-flight-edit',id=>openFlightEditor(id)],['data-flight-delete',id=>deleteTravelRecord('flights',id)],['data-flight-status',id=>{const f=data.flights.find(x=>String(x.id)===id);if(f)window.open(flightStatusUrl(f),'_blank','noopener')}],['data-flight-group-edit',id=>openFlightEditor(undefined,id)],['data-flight-group-delete',id=>deleteFlightGroup(id)]]){const el=e.target.closest('['+attribute+']');if(el){action(el.getAttribute(attribute));return}}if(!e.target.closest('.search-combo'))closeFlightOptions()});document.addEventListener('focusin',e=>{if(!e.target.closest('.search-combo'))closeFlightOptions()})}
function validStopDay(f,t){return Number.isInteger(Number(f.stopDay))&&Number(f.stopDay)>=1&&Number(f.stopDay)<=t.days}
function desiredFlightCards(t){const result=[],groups=new Map(),add=(f,role,day,arrival)=>result.push({f,role,day,arrival});for(const f of t.flights||[]){if(f.groupId){const key=String(f.groupId);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f)}else if(f.direction==='去程'||f.direction==='回程')add(f,'endpoint',f.direction==='去程'?1:t.days,f.direction==='去程')}
for(const group of groups.values()){group.sort((a,b)=>(a.groupOrder||0)-(b.groupOrder||0));const outbound=group.filter(f=>flightRole(f)==='outbound'),back=group.filter(f=>flightRole(f)==='return');const final=outbound.at(-1),first=back[0];if(final)add(final,'endpoint',1,true);if(first)add(first,'endpoint',t.days,false);for(const f of group)if(f.stopType==='visit'&&!(f===final&&Number(f.stopDay)===1))add(f,'stop',validStopDay(f,t)?Number(f.stopDay):0,true)}return result}
function syncAirportCards(t){if(!t||!Array.isArray(t.items))return;const specs=desiredFlightCards(t),wanted=new Set(specs.map(s=>String(s.f.id)+'|'+s.role)),seen=new Set(),removed=[];t.items=t.items.filter(item=>{const id=generatedFlightId(item);if(id===null)return true;const role=item._flightRole||'endpoint',key=id+'|'+role;if(!wanted.has(key)||seen.has(key)){removed.push(item.id);return false}seen.add(key);item._flightId=id;item._flightRole=role;return true});cleanAirportReferences(t,removed);for(const s of specs){const f=s.f,id=String(f.id);let item=t.items.find(x=>generatedFlightId(x)===id&&(x._flightRole||'endpoint')===s.role);if(!item){item={id:'airport_'+id+(s.role==='stop'?'_stop':''),category:'其他',duration:0,hours:'',map:'',note:'',transport:{},done:false,costAmount:null,currency:({JP:'JPY',KR:'KRW'})[t.country]||'TWD',priceUnit:'person',airportPlan:{}};t.items.push(item)}item._flightId=id;item._flightRole=s.role;item._airportKind=s.arrival?'arrival':'departure';item.day=s.day;item.name=(s.role==='stop'?'出境停留機場：':s.arrival?'抵達機場：':'返程機場：')+airportDisplay(s.arrival?f.destination:f.origin);item.time=time24(s.arrival?f.arrive:f.depart);item.flightNumber=f.number||'';item.flightDate=dateISO(s.arrival?(f.arrivalDate||f.date):f.date);item.airport=s.arrival?f.destination:f.origin;item.address=item.airport||'';item.flightTime=item.time;item.airportPlan=item.airportPlan||{};item._flightPendingDay=s.day===0}}


function dayDateISO(t,n){if(!validDate(t.start))return '';const [year,month,date]=dateISO(t.start).split('-').map(Number),d=new Date(year,month-1,date);d.setDate(d.getDate()+n-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function arrangeRelatedFields(){for(const [a,b] of [['tmode','tsubtype'],['tripDetailsDays','tripDetailsCountry'],['tripDetailsMode','tripDetailsParty'],['countrySetting','navSetting']]){const first=$(a)?.closest('.field'),second=$(b)?.closest('.field');if(!first||!second||first.parentNode!==second.parentNode||first.nextElementSibling!==second||first.parentNode?.classList.contains('field-pair'))continue;const pair=document.createElement('div');pair.className='field-pair';first.before(pair);pair.appendChild(first);pair.appendChild(second)}}

// V3.8 uses the existing single action row as a sticky row on desktop and mobile.
let stickyBarObserver=null,observedStickyBar=null,stickyMeasureQueued=false;
let rdStickyFiltersOpen=false;
const stickyEditorSelector='#flightDialog,#travelModal,#tripDetailsDialog,#airportEditor,#editor:not(.hidden),#listEditor:not(.hidden),#transportEditor:not(.hidden)';
function stickyBarsSuspended(){return document.body.classList.contains('keyboard-open')||document.body.classList.contains('sticky-space-limited')||!!document.querySelector(stickyEditorSelector)}
function activeStickyBar(){if(stickyBarsSuspended())return null;return tab==='itinerary'?$('itinerarySticky'):tab==='flights'?$('flightSticky'):tab==='hotels'?$('hotelSticky'):tab==='checklist'?$('checklistSticky'):null}
function syncStickyBarMetrics(){stickyMeasureQueued=false;const bannerHeight=$('globalBanner')?.getBoundingClientRect().height||0,navHeight=document.querySelector('.bottom')?.getBoundingClientRect().height||75;document.body.classList.toggle('sticky-space-limited',window.innerHeight-bannerHeight-navHeight<100);const bar=activeStickyBar(),visible=bar&&!bar.classList.contains('hidden');if(observedStickyBar!==bar){stickyBarObserver?.disconnect();observedStickyBar=bar;if(bar)stickyBarObserver?.observe(bar)}const height=visible?Math.ceil(bar.getBoundingClientRect().height):0;document.documentElement.style.setProperty('--page-sticky-height',height+'px')}
function queueStickyBarMetrics(){if(stickyMeasureQueued)return;stickyMeasureQueued=true;requestAnimationFrame(syncStickyBarMetrics)}
function stickyBottom(){const banner=$('globalBanner')?.getBoundingClientRect().bottom||0,bar=activeStickyBar();if(!bar||bar.classList.contains('hidden'))return banner;const rect=bar.getBoundingClientRect();return rect.top<=banner+5?Math.max(banner,rect.bottom):banner}
function initStickyBars(){if(typeof ResizeObserver!=='undefined'){stickyBarObserver=new ResizeObserver(queueStickyBarMetrics);const viewportObserver=new ResizeObserver(queueStickyBarMetrics);for(const el of [$('globalBanner'),document.querySelector('.bottom')])if(el)viewportObserver.observe(el)}if(typeof MutationObserver!=='undefined')new MutationObserver(queueStickyBarMetrics).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','open']});window.addEventListener('resize',queueStickyBarMetrics);window.addEventListener('orientationchange',queueStickyBarMetrics);window.visualViewport?.addEventListener('resize',queueStickyBarMetrics);document.addEventListener('focusin',queueStickyBarMetrics);document.addEventListener('focusout',queueStickyBarMetrics);queueStickyBarMetrics()}

try{initStickyBars();initFlightEvents();applyFontScale();render();initBanner();initMobileEditing();initTimeInputs()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="notice">載入行程時發生錯誤，請使用 Safari 直接開啟已發布的網站，或重新下載此檔案。</div>'}
</script></body></html>
